<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Offline · Life Tracker</title>
  <style>
    :root { color-scheme: light dark; --bg:#f2f2f7; --card:#fff; --fg:#0b0b0c; --muted:#6b6b73; --accent:#16a34a; }
    @media (prefers-color-scheme: dark) { :root { --bg:#000; --card:#1c1c1e; --fg:#f5f5f7; --muted:#9a9aa2; --accent:#22c55e; } }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
           font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:24px; box-sizing:border-box; }
    .card { background:var(--card); border-radius:20px; padding:28px 24px; max-width:360px; text-align:center; }
    h1 { font-size:20px; margin:12px 0 8px; }
    p { color:var(--muted); line-height:1.5; margin:0 0 20px; }
    button { font:inherit; font-weight:600; border:0; border-radius:12px; padding:12px 20px; background:var(--accent); color:#fff; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" width="56" height="56" alt="" style="border-radius:14px">
    <h1>You're offline</h1>
    <p>Life Tracker needs a connection to load. A workout you were logging is still saved on this phone and will upload when you're back online.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
