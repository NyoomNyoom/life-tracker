<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f2ee">
  <title>Offline · Life Tracker</title>
  <style>
    /* Colour Block tokens (see app/globals.css). Self-contained: this page is served from the service worker cache. */
    :root { color-scheme: light; --ground:#f3f2ee; --ink:#17150f; --butter:#ffe27a; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--ground); color:#fff; padding:12px;
           font-family:"Bricolage Grotesque",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    .tile { background:var(--ink); border-radius:28px; padding:24px 22px; width:100%; max-width:420px; }
    .icon { width:60px; height:60px; border-radius:18px; background:var(--butter); color:var(--ink); display:grid; place-items:center; }
    h1 { font-size:38px; font-weight:800; letter-spacing:-0.03em; line-height:1; margin:22px 0 14px; }
    p { color:rgba(255,255,255,0.8); font-size:17px; line-height:1.5; font-weight:500; margin:0 0 22px; }
    button { font:inherit; font-size:18px; font-weight:700; border:0; border-radius:999px; height:56px; width:100%;
             background:var(--butter); color:var(--ink); cursor:pointer; }
    button:active { opacity:.85; }
  </style>
</head>
<body>
  <div class="tile">
    <div class="icon" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m2 2 20 20"/><path d="M5.782 5.782A7 7 0 0 0 9 19h8.5a4.5 4.5 0 0 0 1.307-.193"/><path d="M21.532 16.5A4.5 4.5 0 0 0 17.5 10h-1.79A7.008 7.008 0 0 0 10 5.07"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>Life Tracker needs a connection to load. A workout you were logging is still saved on this phone and will upload when you're back online.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
