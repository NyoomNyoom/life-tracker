<h2>Reset your password</h2>
<p>Tap the button below to choose a new password for Life Tracker.</p>
<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
     style="display:inline-block;padding:12px 20px;background:#16a34a;color:#ffffff;border-radius:10px;text-decoration:none;font-weight:600">
    Choose a new password
  </a>
</p>
<p style="color:#6b7280;font-size:13px">If you didn't ask for this, you can ignore this email. Your password won't change.</p>
